name: github pages

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '10'
          
      - name: Configure git
        uses: fusion-engineering/setup-git-credentials@v2
        with:
          credentials: ${{secrets.PUBLIC_READ_PAT}}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci
      - name: Find theme
        run: |
          echo "SITE_THEME=$(./get-theme.js)" >> $GITHUB_ENV
      - run: npm run build -- --theme ${{ env.SITE_THEME }}
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
      - name: Wait for the application resume to publish
        run: |
          URL="https://straz.to/resume/application.html?bust=${{ github.sha }}"
          EXPECTED_HASH=$(sha256sum public/application.html | cut -d' ' -f1)
          for i in $(seq 1 60); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$URL" -o /tmp/published-resume.html; then
              ACTUAL_HASH=$(sha256sum /tmp/published-resume.html | cut -d' ' -f1)
              if [ "$ACTUAL_HASH" = "$EXPECTED_HASH" ]; then
                echo "Published application resume matches this build."
                exit 0
              fi
            fi
            echo "Attempt $i: waiting for the current application resume..."
            sleep 5
          done
          echo "The application resume did not publish within five minutes."
          exit 1
      - name: Build pdf
        uses: misaelnieto/web_to_pdf_action@master
        with:
          # bust=${{ github.sha }} forces a cache bust
          webPageURL: https://straz.to/resume/application.html?bust=${{ github.sha }}
          outputFile: ./resume.pdf
          usePuppeteer: true
          pdfOptions: '{"format": "A4", "scale": 1, "margin": {"top": "12mm", "left": "12mm", "right": "12mm", "bottom": "12mm"}}'
      - name: Publish
        uses: softprops/action-gh-release@v1
        with:
            tag_name: daily
            files: resume.pdf
            body: |
              Daily build of pdf, regenerated every commit.
            github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
